<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom | Shopping Cart</title>
  <link rel="stylesheet" href="bloom-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <div id="navbar"></div>

  <!-- Cart Header -->
  <section class="page-header">
    <div class="container">
      <h1>Shopping Cart</h1>
      <p>Review your items before checkout</p>
    </div>
  </section>

  <!-- Cart Section -->
  <section class="cart-section">
    <div class="container">
      <div class="cart-content">
        
        <!-- Cart Items -->
        <div class="cart-items">
          <div class="cart-item">
            <img src="images/image2222.png" alt="Plant" class="cart-item-image">
            <div class="cart-item-details">
              <h3>Dieffenbachia Plant</h3>
              <p class="cart-item-price">SAR 180</p>
            </div>
            <div class="cart-item-quantity">
              <button class="qty-btn minus"><i class="fas fa-minus"></i></button>
              <input type="number" value="1" min="1" class="qty-input">
              <button class="qty-btn plus"><i class="fas fa-plus"></i></button>
            </div>
            <div class="cart-item-total">
              <p>SAR 180</p>
            </div>
            <button class="cart-item-remove"><i class="fas fa-trash"></i></button>
          </div>

          <div class="cart-item">
            <img src="images/image2222.png" alt="Plant" class="cart-item-image">
            <div class="cart-item-details">
              <h3>Monstera Deliciosa</h3>
              <p class="cart-item-price">SAR 250</p>
            </div>
            <div class="cart-item-quantity">
              <button class="qty-btn minus"><i class="fas fa-minus"></i></button>
              <input type="number" value="2" min="1" class="qty-input">
              <button class="qty-btn plus"><i class="fas fa-plus"></i></button>
            </div>
            <div class="cart-item-total">
              <p>SAR 500</p>
            </div>
            <button class="cart-item-remove"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
          <h3>Order Summary</h3>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span>SAR 680</span>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <span>SAR 50</span>
          </div>
          <div class="summary-row">
            <span>Tax (15%)</span>
            <span>SAR 102</span>
          </div>
          <hr>
          <div class="summary-row total">
            <span>Total</span>
            <span>SAR 832</span>
          </div>

          <button class="btn btn-primary btn-block">Proceed to Checkout</button>
          <a href="shop-page.html" class="btn btn-secondary btn-block">Continue Shopping</a>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    // Load navbar and footer
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("navbar").innerHTML = data;
        });
      
      fetch("footer.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("footer").innerHTML = data;
        });
    });
  </script>

  <!-- Chatbot Widget -->
  <input type="checkbox" id="chatbot-toggle" class="chatbot-toggle-checkbox">
  <div class="chatbot-container">
    <div class="chatbot-header">
      <h3>Chat with us</h3>
      <label for="chatbot-toggle" class="chatbot-close">✕</label>
    </div>
    <div class="chatbot-messages">
      <div class="chatbot-message bot-message">
        <div class="message-avatar">
          <img src="images/bloom_logo_trimmed.png" alt="Bloom" class="avatar-logo">
        </div>
        <div class="message-content">
          <p>Hi! Welcome to Bloom! 👋</p>
          <p>How can I help you today?</p>
        </div>
      </div>
    </div>
    <div class="chatbot-input-area">
      <input type="text" class="chatbot-input" placeholder="Type your message...">
      <button class="chatbot-send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
  <label for="chatbot-toggle" class="chatbot-button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </label>

  <script src="bloom-interactions.js"></script>
</body>
</html>
