<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom | Shopping Cart</title>
  <link rel="stylesheet" href="bloom-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <div id="navbar"></div>

  <!-- Cart Header -->
  <section class="page-header">
    <div class="container">
      <h1>Shopping Cart</h1>
      <p>Review your items before checkout</p>
    </div>
  </section>

  <!-- Cart Section -->
  <section class="cart-section">
    <div class="container">
      <div class="cart-content">
        
        <!-- Cart Items -->
        <div class="cart-items">
          <div class="cart-item">
            <img src="images/image2222.png" alt="Plant" class="cart-item-image">
            <div class="cart-item-details">
              <h3>Dieffenbachia Plant</h3>
              <p class="cart-item-price">SAR 180</p>
            </div>
            <div class="cart-item-quantity">
              <button class="qty-btn minus"><i class="fas fa-minus"></i></button>
              <input type="number" value="1" min="1" class="qty-input">
              <button class="qty-btn plus"><i class="fas fa-plus"></i></button>
            </div>
            <div class="cart-item-total">
              <p>SAR 180</p>
            </div>
            <button class="cart-item-remove"><i class="fas fa-trash"></i></button>
          </div>

          <div class="cart-item">
            <img src="images/image2222.png" alt="Plant" class="cart-item-image">
            <div class="cart-item-details">
              <h3>Monstera Deliciosa</h3>
              <p class="cart-item-price">SAR 250</p>
            </div>
            <div class="cart-item-quantity">
              <button class="qty-btn minus"><i class="fas fa-minus"></i></button>
              <input type="number" value="2" min="1" class="qty-input">
              <button class="qty-btn plus"><i class="fas fa-plus"></i></button>
            </div>
            <div class="cart-item-total">
              <p>SAR 500</p>
            </div>
            <button class="cart-item-remove"><i class="fas fa-trash"></i></button>
          </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
          <h3>Order Summary</h3>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span>SAR 680</span>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <span>SAR 50</span>
          </div>
          <div class="summary-row">
            <span>Tax (15%)</span>
            <span>SAR 102</span>
          </div>
          <hr>
          <div class="summary-row total">
            <span>Total</span>
            <span>SAR 832</span>
          </div>

          <button class="btn btn-primary btn-block">Proceed to Checkout</button>
          <a href="shop-page.html" class="btn btn-secondary btn-block">Continue Shopping</a>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    // Load navbar and footer
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("navbar").innerHTML = data;
        });
      
      fetch("footer.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("footer").innerHTML = data;
        });
    });
  </script>

</body>
</html>
